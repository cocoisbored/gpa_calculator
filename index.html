<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator - Advanced Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background-mesh"></div>

    <div class="container">
        <header>
            <h1>redefine your GPA for TUAT</h1>
            <p class="subtitle">TUAT自己都合GPA計算分析ツール</p>
        </header>

        <section class="glass-panel main-controls">
            <div class="settings">
                <h2>⚙️ 計算の設定</h2>

                <label class="toggle-container">
                    <input type="checkbox" id="includeSpecial" checked>
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">博物館科目と教職科目を全体のGPA計算に含める</span>
                </label>

                <label class="toggle-container">
                    <input type="checkbox" id="excludeFailed">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">不合格科目 (D評価など) をGPA対象単位から除外する</span>
                </label>
            </div>

            <div class="file-upload" id="dropZone">
                <input type="file" id="fileInput" accept=".csv" class="file-input">
                <div class="upload-content">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h3>CSVファイルをドラッグ＆ドロップ</h3>
                    <p>またはクリックして score.csv を選択</p>
                </div>
            </div>
        </section>

        <!-- 結果表示領域（ファイル読み込み後に表示） -->
        <section id="resultsSection" class="results-section hidden">

            <div class="info-gpa-container">
                <div class="glass-panel student-info">
                    <h2>🎓 学生情報</h2>
                    <div id="studentDetails" class="info-grid">
                        <!-- JSで挿入 -->
                    </div>
                </div>

                <div class="glass-panel overall-gpa">
                    <h2>🌟 総合成績</h2>
                    <div class="gpa-score" id="overallGpaDisplay">--</div>
                    <div class="stats-grid" id="overallStats">
                        <!-- JSで挿入 -->
                    </div>
                </div>
            </div>

            <h2 class="section-title">📊 科目群別 成績</h2>
            <div class="group-grid" id="groupGrid">
                <!-- JSで各科目群のカードを生成 -->
            </div>

        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
