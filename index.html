<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator - Advanced Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>
    <div class="background-mesh"></div>

    <div class="container">
        <header>
            <h1>redefine your GPA for TUAT</h1>
            <p class="subtitle">TUAT自己都合GPA計算分析ツール</p>
        </header>

        <section class="glass-panel main-controls">
            <div class="settings">
                <h2>⚙️ 計算・判定の設定</h2>

                <div class="select-group" style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label for="enrollmentYear"
                            style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; color: #555;">入学年度</label>
                        <select id="enrollmentYear"
                            style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                            <option value="2025">2025年度</option>
                            <option value="2024">2024年度</option>
                            <option value="2023">2023年度</option>
                            <option value="2022">2022年度</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label for="department"
                            style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; color: #555;">学科</label>
                        <select id="department"
                            style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                            <option value="機械システム工学科">機械システム工学科</option>
                            <option value="知能情報システム工学科">知能情報システム工学科</option>
                            <option value="応用化学科">応用化学科</option>
                            <option value="生命工学科">生命工学科</option>
                            <option value="生体医用システム工学科">生体医用システム工学科</option>
                            <option value="化学物理工学科">化学物理工学科</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label for="courseSelect"
                            style="display:block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; color: #555;">コース</label>
                        <select id="courseSelect"
                            style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                            <option value="base">未選択 / ベース要件</option>
                            <option value="航空宇宙・機械科学コース">航空宇宙・機械科学コース</option>
                            <option value="ロボティクス・知能機械デザインコース">ロボティクス・知能機械デザインコース</option>
                        </select>
                    </div>
                </div>

                <label class="toggle-container">
                    <input type="checkbox" id="takeTeaching">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">教職課程の要件判定と集計を行う</span>
                </label>

                <label class="toggle-container">
                    <input type="checkbox" id="takeMuseum">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">学芸員資格（博物館科目）の判定と集計を行う</span>
                </label>

                <label class="toggle-container">
                    <input type="checkbox" id="excludeFailed">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">不合格科目 (D評価など) をGPA対象単位から除外する</span>
                </label>
            </div>

            <div class="file-upload" id="dropZone">
                <input type="file" id="fileInput" accept=".csv" class="file-input">
                <div class="upload-content">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h3>CSVファイルをドラッグ＆ドロップ</h3>
                    <p>またはクリックして score.csv を選択</p>
                </div>
            </div>
        </section>

        <!-- 結果表示領域（ファイル読み込み後に表示） -->
        <section id="resultsSection" class="results-section hidden">

            <div class="info-gpa-container">
                <div class="glass-panel student-info">
                    <h2>🎓 学生情報</h2>
                    <div id="studentDetails" class="info-grid">
                        <!-- JSで挿入 -->
                    </div>
                </div>

                <div class="glass-panel overall-gpa">
                    <h2>🌟 総合成績</h2>
                    <div class="gpa-score" id="overallGpaDisplay">--</div>
                    <div class="stats-grid" id="overallStats">
                        <!-- JSで挿入 -->
                    </div>
                </div>
            </div>

            <h2 class="section-title" style="margin-top: 40px;">🎯 進級・卒業要件チェック</h2>
            <div id="requirementsSection" class="glass-panel"
                style="margin-bottom: 30px; background: rgba(255, 255, 255, 0.9);">
                <!-- JSで判定結果を挿入 -->
            </div>

            <h2 class="section-title">📊 科目群別 成績</h2>
            <div class="group-grid" id="groupGrid">
                <!-- JSで各科目群のカードを生成 -->
            </div>

        </section>

    </div>

    <script src="REQUIREMENTS_DATA.js?v=2"></script>
    <script src="script.js?v=2"></script>
</body>

</html>
